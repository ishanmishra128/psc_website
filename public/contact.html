    <!-- hero -->
    <section
      class="hero is-small"
      style="
        background-image: url(&quot;images/bracelets.png&quot;);
        background-size: cover;
        background-position: center 55%;
      "
    >
      <div class="hero-body">
        <div class="container">
          <h1
            class="title is-2 has-text-white has-text-centered has-text-shadow2"
          >
            Contact Us
          </h1>
          <p
            class="subtitle is-4 has-text-centered has-text-white has-text-weight-bold has-text-shadow2"
          >
            Get in touch with the Palestine Solidarity Committee
          </p>
        </div>
      </div>
    </section>

    <!-- main content-->
    <section class="section contact-section">
      <div class="container">
        <div class="columns is-variable is-6 is-centered">
          <!-- left section -->
          <div class="column is-full-tablet is-6-desktop">
            <div class="box contact-card">
              <p class="title is-4 mb-3">Send Us a Message</p>
              <p class="mb-4 has-text-grey-dark">
                Fill out the form below and we’ll get back to you as soon as
                possible.
              </p>

              <!-- start of form -->
              <form id="contactForm">
                <!-- name -->
                <div class="field">
                  <label class="label">Name</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      name="name"
                      placeholder="Your name"
                      required
                    />
                  </div>
                </div>

                <!-- email -->
                <div class="field">
                  <label class="label">Email</label>
                  <div class="control">
                    <input
                      class="input"
                      type="email"
                      name="email"
                      placeholder="your.email@example.com"
                      required
                    />
                  </div>
                </div>

                <!-- Subject -->
                <div class="field">
                  <label class="label">Subject</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      name="subject"
                      placeholder="What is this regarding?"
                    />
                  </div>
                </div>

                <!-- message -->
                <div class="field">
                  <label class="label">Message</label>
                  <div class="control">
                    <textarea
                      class="textarea"
                      name="message"
                      rows="5"
                      placeholder="Your message..."
                      required
                    ></textarea>
                  </div>
                </div>

                <!-- Send Message button -->
                <button
                  type="submit"
                  class="button is-green is-fullwidth has-text-weight-bold"
                  style="border-radius: 8px"
                >
                  Send Message
                </button>
              </form>
            </div>
          </div>

          <!-- right section, contact info -->
          <div class="column is-full-tablet is-6-desktop is-right">
            <a
              href="mailto:pscuwmadison@gmail.com"
              class="box contact-card mb-5 is-flex is-align-items-center"
              style="text-decoration: none; color: inherit"
            >
              <span class="icon has-text-green mr-3 is-large">
                <i class="fa fa-envelope fa-lg"></i>
              </span>
              <div>
                <p class="title is-5 mb-0">Email</p>
                <p class="has-text-grey-dark">pscuwmadison@gmail.com</p>
              </div>
            </a>

            <a
              href="https://www.instagram.com/pscuwmadison/"
              target="_blank"
              class="box contact-card mb-5 is-flex is-align-items-center"
              style="text-decoration: none; color: inherit"
            >
              <span class="icon has-text-green mr-3 is-large">
                <i class="fa fa-instagram fa-lg"></i>
              </span>
              <div>
                <p class="title is-5 mb-0">Instagram</p>
                <p class="has-text-grey-dark">@pscuwmadison</p>
              </div>
            </a>

            <!-- Picture goes here -->
            <div class="box contact-card p-4">
              <figure class="image cover">
                <img
                  src="images/itemsforsale.png"
                  alt="Palestine Solidarity Committee Bake Sale"
                />
              </figure>
            </div>
          </div>
        </div>
