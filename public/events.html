    <!-- Login modal -->
<div class="modal" id="loginModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head has-background-black">
      <p class="modal-card-title">Log In</p>
      <button class="delete" id="closeLoginModal" aria-label="close"></button>
    </header>
    <section class="modal-card-body">
      <div class="field">
        <label class="label">Email</label>
        <div class="control has-icons-left">
          <input class="input" type="email" id="loginEmail" placeholder="netid@wisc.edu">
          <span class="icon is-left"><i class="fas fa-envelope"></i></span>
        </div>
      </div>
      <div class="field">
        <label class="label">Password</label>
        <div class="control has-icons-left">
          <input class="input" type="password" id="loginPassword" placeholder="Password">
          <span class="icon is-left"><i class="fas fa-lock"></i></span>
        </div>
      </div>
      <p class="has-text-danger is-size-7 mt-2" id="loginError"></p>
    </section>
    <footer class="modal-card-foot">
      <button class="button is-green" id="loginSubmit">Log In</button>
      <button class="button" id="cancelLogin">Cancel</button>
    </footer>
  </div>
</div>
<!-- Sign up modal -->
<div class="modal" id="signupModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head has-background-black">
      <p class="modal-card-title">Sign Up</p>
      <button class="delete" id="closeSignupModal" aria-label="close"></button>
    </header>
    <section class="modal-card-body">
      <div class="columns">
        <div class="column">
          <div class="field">
            <label class="label">First Name</label>
            <div class="control">
              <input class="input" type="text" id="signupFirstName" placeholder="First Name">
            </div>
          </div>
        </div>
        <div class="column">
          <div class="field">
            <label class="label">Last Name</label>
            <div class="control">
              <input class="input" type="text" id="signupLastName" placeholder="Last Name">
            </div>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label">Email</label>
        <div class="control has-icons-left">
          <input class="input" type="email" id="signupEmail" placeholder="netid@wisc.edu">
          <span class="icon is-left"><i class="fas fa-envelope"></i></span>
        </div>
        <p class="help">Must be a <strong>@wisc.edu</strong> email address.</p>
      </div>
      <div class="field">
        <label class="label">Password</label>
        <div class="control has-icons-left">
          <input class="input" type="password" id="signupPassword" placeholder="Minimum 6 characters">
          <span class="icon is-left"><i class="fas fa-lock"></i></span>
        </div>
      </div>
      <p class="has-text-danger is-size-7 mt-2" id="signupError"></p>
    </section>
    <footer class="modal-card-foot">
      <button class="button is-green" id="signupSubmit">Sign Up</button>
      <button class="button" id="cancelSignup">Cancel</button>
    </footer>
  </div>
</div>
<!-- Admin: Create Event Modal -->
<div class="modal" id="adminEventModal">
  <div class="modal-background"></div>
  <div class="modal-card" style="max-width: 600px; width: 90%;">
    <header class="modal-card-head has-background-black">
      <p class="modal-card-title has-text-white">Create New Event</p>
      <button class="delete" id="closeAdminModal" aria-label="close"></button>
    </header>
    <section class="modal-card-body">

      <div class="field">
        <label class="label">Event Title *</label>
        <div class="control">
          <input class="input" type="text" id="adminEventTitle" placeholder="e.g. PSC Ramadan Iftar">
        </div>
      </div>

      <div class="field">
        <label class="label">Subtitle</label>
        <div class="control">
          <input class="input" type="text" id="adminEventSubtitle" placeholder="e.g. Dinner event">
        </div>
      </div>

      <div class="field">
        <label class="label">Category *</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select id="adminEventCategory">
              <option value="">Select a category</option>
              <option value="Community">Community</option>
              <option value="Cultural">Cultural</option>
              <option value="Educational">Educational</option>
              <option value="Planning">Planning</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label">Location *</label>
        <div class="control">
          <input class="input" type="text" id="adminEventLocation" placeholder="e.g. MSC Lounge, Red Gym">
        </div>
      </div>

      <div class="field">
        <label class="label">Start Date & Time *</label>
        <div class="control">
          <input class="input" type="datetime-local" id="adminEventStart">
        </div>
      </div>

      <div class="field">
        <label class="label">End Date & Time *</label>
        <div class="control">
          <input class="input" type="datetime-local" id="adminEventEnd">
        </div>
      </div>

      <div class="field">
        <label class="label">Description *</label>
        <div class="control">
          <textarea class="textarea" id="adminEventDesc" rows="4"
            placeholder="Describe the event..."></textarea>
        </div>
      </div>

      <p class="has-text-danger is-size-7" id="adminEventError"></p>

    </section>
    <footer class="modal-card-foot" style="justify-content: flex-end; gap: 0.5rem;">
      <button class="button" id="cancelAdminEvent">Cancel</button>
      <button class="button is-green has-text-weight-bold" id="adminEventSubmit">
        Create Event
      </button>
    </footer>
  </div>
</div>
<!-- Admin: RSVP List Modal -->
<div class="modal" id="rsvpModal">
  <div class="modal-background"></div>
  <div class="modal-card" style="max-width: 600px; width: 90%;">
    <header class="modal-card-head has-background-black">
      <div>
        <p class="modal-card-title has-text-white" id="rsvpModalTitle">RSVPs</p>
        <p class="is-size-7 has-text-grey-light" id="rsvpCount"></p>
      </div>
      <button class="delete" id="closeRsvpModal" aria-label="close"></button>
    </header>
    <section class="modal-card-body">
      <div id="rsvpList">
        <p class="has-text-grey has-text-centered">Loading...</p>
      </div>
    </section>
    <footer class="modal-card-foot" style="justify-content: flex-end;">
      <button class="button" id="cancelRsvpModal">Close</button>
    </footer>
  </div>
</div>
